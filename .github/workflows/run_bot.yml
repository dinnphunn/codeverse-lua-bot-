name: Run CodeVerse Lua Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Download Luvit Directly
        run: |
          curl -LO https://github.com/luvit/luvit/releases/latest/download/luvit-linux-amd64
          mv luvit-linux-amd64 luvit
          chmod +x luvit
          curl -LO https://github.com/luvit/lit/releases/latest/download/lit-linux-amd64
          mv lit-linux-amd64 lit
          chmod +x lit

      - name: Install Dependencies
        run: |
          ./lit install discordia

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          ./luvit bot.lua
