name: Run CodeVerse Lua Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v3

    - name: Setup Luvit / Lua Environment
      uses: luvit/action-setup@v1

    - name: Install Dependencies
      run: |
        lit install discordia

    - name: Run Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        luvit bot.lua
