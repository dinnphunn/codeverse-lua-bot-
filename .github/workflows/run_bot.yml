name: Run CodeVerse Lua Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Install Luvit and Lit
        run: |
          # Chạy script cài đặt chính thức của Luvit
          curl -L https://github.com/luvit/luvit/raw/master/tools/install.sh | bash

      - name: Install Dependencies
        run: |
          # Script trên sẽ tự tải lit, luvi và luvit vào thư mục hiện tại
          ./lit install discordia

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          ./luvit bot.lua
